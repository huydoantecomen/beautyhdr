# Kiểm thử script gói Cập nhật (packaging/cap_nhat.ps1) trên Windows thật: nhận thư mục bản cũ, tìm, ghi đè mã mới,
# giữ _build. Không build app (nhanh, ~1 phút).
name: Kiem thu goi Cap nhat

on:
  workflow_dispatch:
  push:
    paths: ["packaging/cap_nhat.ps1", "packaging/nguoi_dung/*.bat", ".github/workflows/kiem-cap-nhat.yml"]

jobs:
  kiem:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 (như máy người dùng)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\cap_nhat.ps1 -KiemThu -NguonMoi "$env:GITHUB_WORKSPACE"
      - name: Chạy đường chính với -Target, không build
        shell: powershell
        run: |
          $old = Join-Path $env:RUNNER_TEMP "ban cu\NetAnh-0.14.2"
          New-Item -ItemType Directory -Force -Path (Join-Path $old "ma-nguon\net_anh"), (Join-Path $old "ma-nguon\_build") | Out-Null
          Set-Content -LiteralPath (Join-Path $old "ma-nguon\net_anh\__init__.py") -Value '__version__ = "0.14.2"'
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\cap_nhat.ps1 -Target $old -NguonMoi "$env:GITHUB_WORKSPACE" -NoBuild
          if ($LASTEXITCODE -ne 0) { throw "cap_nhat.ps1 lỗi $LASTEXITCODE" }
          $v = Get-Content -LiteralPath (Join-Path $old "ma-nguon\net_anh\__init__.py") -Raw
          if ($v -notmatch ([regex]::Escape(([regex]::Match((Get-Content -LiteralPath net_anh\__init__.py -Raw), '__version__ = "([^"]+)"')).Groups[1].Value))) { throw "chưa ghi đè: $v" }
          if (-not (Test-Path -LiteralPath (Join-Path $old "ma-nguon\_build"))) { throw "mất _build" }
          # đường gọi build_windows.ps1 thật (không build): -CapNhat phải vào đúng tham số, không rơi vào -Flavor
          $env:NETANH_KIEM_THAM_SO = "1"
          $o1 = powershell -NoProfile -ExecutionPolicy Bypass -File packaging\cap_nhat.ps1 -Target $old -NguonMoi "$env:GITHUB_WORKSPACE" 2>&1 | Out-String
          Write-Host $o1
          if ($o1 -notmatch "THAMSO CapNhat=True Flavor=cpu FlavorGiven=False") { throw "CAP_NHAT.bat: sai tham số: $o1" }
          $o2 = powershell -NoProfile -ExecutionPolicy Bypass -File packaging\cap_nhat.ps1 -Target $old -NguonMoi "$env:GITHUB_WORKSPACE" -Flavor cuda 2>&1 | Out-String
          Write-Host $o2
          if ($o2 -notmatch "THAMSO CapNhat=True Flavor=cuda FlavorGiven=True") { throw "CHUYEN_SANG_GPU.bat: sai tham số: $o2" }
          # đúng như file .bat gọi (STA, -File, %* rỗng)
          $o3 = powershell -NoProfile -ExecutionPolicy Bypass -STA -File packaging\cap_nhat.ps1 -Flavor cuda -Target $old -NguonMoi "$env:GITHUB_WORKSPACE" 2>&1 | Out-String
          if ($o3 -notmatch "Flavor=cuda FlavorGiven=True") { throw "gọi như .bat: sai tham số: $o3" }
          Remove-Item Env:NETANH_KIEM_THAM_SO
          # chạy thẳng từ mã nguồn (chưa cài setup.exe): .venv thật, chỉ bỏ pip (không cần mạng)
          $dir = Join-Path $env:RUNNER_TEMP "chay thang\BeautyHDR-0.15.0-dev"
          New-Item -ItemType Directory -Force -Path (Join-Path $dir "ma-nguon\net_anh") | Out-Null
          Set-Content -LiteralPath (Join-Path $dir "ma-nguon\net_anh\__init__.py") -Value '__version__ = "0.15.0"'
          Set-Content -LiteralPath (Join-Path $dir "ma-nguon\giu-lai.txt") -Value "model của tôi"
          python -m venv (Join-Path $dir "ma-nguon\.venv")
          # tự nhận (không có setup.exe, có .venv → chạy thẳng)
          $o4 = powershell -NoProfile -ExecutionPolicy Bypass -STA -File packaging\cap_nhat.ps1 -Target $dir -NguonMoi "$env:GITHUB_WORKSPACE" -KhongMo -BoQuaPip 2>&1 | Out-String
          Write-Host $o4
          # (chỉ so mẫu ASCII: script inline của runner không có BOM nên chữ có dấu trong mẫu bị đọc sai)
          if ($o4 -notmatch ("XONG[^\r\n]*" + ([regex]::Escape(([regex]::Match((Get-Content -LiteralPath net_anh\__init__.py -Raw), '__version__ = "([^"]+)"')).Groups[1].Value)))) { throw "chay thang (tu nhan) loi: $o4" }
          if (-not (Test-Path -LiteralPath (Join-Path $dir "ma-nguon\giu-lai.txt"))) { throw "mất file riêng" }
          # ép bằng CAP_NHAT_CHAY_THANG.bat (-Mode chay)
          $o5 = powershell -NoProfile -ExecutionPolicy Bypass -STA -File packaging\cap_nhat.ps1 -Mode chay -Target $dir -NguonMoi "$env:GITHUB_WORKSPACE" -KhongMo -BoQuaPip 2>&1 | Out-String
          if ($o5 -notmatch ("XONG[^\r\n]*" + ([regex]::Escape(([regex]::Match((Get-Content -LiteralPath net_anh\__init__.py -Raw), '__version__ = "([^"]+)"')).Groups[1].Value)))) { throw "chay thang (-Mode chay) loi: $o5" }
          # chưa cài, chưa có .venv: báo rõ cách làm
          $trong = Join-Path $env:RUNNER_TEMP "chua-co-venv"
          New-Item -ItemType Directory -Force -Path (Join-Path $trong "ma-nguon\net_anh") | Out-Null
          Set-Content -LiteralPath (Join-Path $trong "ma-nguon\net_anh\__init__.py") -Value '__version__ = "0.15.0"'
          $o6 = powershell -NoProfile -ExecutionPolicy Bypass -STA -File packaging\cap_nhat.ps1 -Target $trong -NguonMoi "$env:GITHUB_WORKSPACE" 2>&1 | Out-String
          if ($o6 -notmatch "cai_dat\.bat") { throw "phai huong dan chay cai_dat.bat: $o6" }
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\cap_nhat.ps1 -Target (Join-Path $env:RUNNER_TEMP "khong-phai") -NguonMoi "$env:GITHUB_WORKSPACE" -NoBuild
          if ($LASTEXITCODE -eq 0) { throw "phải từ chối thư mục sai" }
          Write-Host "ĐẠT"
          exit 0
